<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution activity by month" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --ink:#FFFFFF; --dim:#AAAAAA; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .bar { transform: scaleY(0); animation: grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    @media (prefers-reduced-motion:reduce) { .bar { animation:none; transform:scaleY(1); } }
  </style>

  <text class="mono" x="48" y="28" font-size="11" letter-spacing="2.5" fill="var(--dim)">CONTRIBUTION TELEMETRY · LAST 12 MONTHS</text>
  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--ink)" opacity=".3"/>

  <g class="mono" font-size="9" fill="var(--ink)">
<rect class="bar" x="70.6" y="176" width="55.2" height="4" fill="var(--ink)" style="transform-origin:70.6px 180px"/>
    <text x="98.2" y="196" text-anchor="middle" fill="var(--dim)">01</text>
    <rect class="bar" x="171.0" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:171.0px 180px"/>
    <text x="198.7" y="196" text-anchor="middle" fill="var(--dim)">02</text>
    <rect class="bar" x="271.5" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:271.5px 180px"/>
    <text x="299.1" y="196" text-anchor="middle" fill="var(--dim)">03</text>
    <rect class="bar" x="371.9" y="116" width="55.2" height="64" fill="var(--ink)" style="transform-origin:371.9px 180px"/>
    <text x="399.6" y="196" text-anchor="middle" fill="var(--dim)">04</text>
    <rect class="bar" x="472.4" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:472.4px 180px"/>
    <text x="500.0" y="196" text-anchor="middle" fill="var(--dim)">05</text>
    <rect class="bar" x="572.8" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:572.8px 180px"/>
    <text x="600.4" y="196" text-anchor="middle" fill="var(--dim)">06</text>
    <rect class="bar" x="673.3" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:673.3px 180px"/>
    <text x="700.9" y="196" text-anchor="middle" fill="var(--dim)">07</text>
    <rect class="bar" x="773.7" y="180" width="55.2" height="0" fill="var(--ink)" style="transform-origin:773.7px 180px"/>
    <text x="801.3" y="196" text-anchor="middle" fill="var(--dim)">08</text>
    <rect class="bar" x="874.2" y="60" width="55.2" height="120" fill="var(--ink)" style="transform-origin:874.2px 180px"/>
    <text x="901.8" y="196" text-anchor="middle" fill="var(--dim)">09</text>
  </g>
</svg>
